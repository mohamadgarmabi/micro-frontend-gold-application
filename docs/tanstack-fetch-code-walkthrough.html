<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tanstack-fetch — Code Walkthrough</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #111827;
        --line: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --green: #34d399;
        --orange: #fb923c;
        --pink: #f472b6;
        --purple: #c084fc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      .stage {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 18px;
        gap: 16px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .brand {
        font-size: 14px;
        letter-spacing: 0.04em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .brand strong {
        color: var(--accent);
        font-weight: 700;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        background: #0f172a;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }

      button:hover {
        border-color: #334155;
      }

      button.primary {
        background: #082f49;
        border-color: #0ea5e9;
        color: #e0f2fe;
      }

      .frame {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
        overflow: hidden;
        min-height: 520px;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: #0b1322;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #334155;
      }

      .dot.r {
        background: #ef4444;
      }
      .dot.y {
        background: #f59e0b;
      }
      .dot.g {
        background: #22c55e;
      }

      .filename {
        margin-left: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        color: var(--muted);
      }

      .code-wrap {
        padding: 22px 24px 28px;
        overflow: auto;
      }

      pre {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        line-height: 1.65;
        white-space: pre;
        tab-size: 2;
      }

      .tok-kw {
        color: var(--pink);
      }
      .tok-fn {
        color: var(--accent);
      }
      .tok-str {
        color: var(--green);
      }
      .tok-cm {
        color: #64748b;
      }
      .tok-num {
        color: var(--orange);
      }
      .tok-type {
        color: var(--purple);
      }
      .tok-prop {
        color: #93c5fd;
      }

      .subtitle {
        min-height: 72px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.92);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 18px;
        line-height: 1.45;
        color: #f8fafc;
      }

      .bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .progress {
        height: 6px;
        border-radius: 999px;
        background: #1e293b;
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0ea5e9, #22d3ee);
        transition: width 0.25s linear;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .title {
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="top">
        <div class="brand"><strong>tanstack-fetch</strong> · code-only walkthrough</div>
        <div class="controls">
          <button id="prevBtn" type="button">Prev</button>
          <button id="playBtn" class="primary" type="button">Play</button>
          <button id="nextBtn" type="button">Next</button>
          <button id="fsBtn" type="button">Fullscreen</button>
        </div>
      </div>

      <section class="frame" aria-live="polite">
        <div class="chrome">
          <span class="dot r"></span>
          <span class="dot y"></span>
          <span class="dot g"></span>
          <div class="filename" id="fileName">api.ts</div>
        </div>
        <div class="code-wrap">
          <pre id="code"></pre>
        </div>
      </section>

      <div class="subtitle" id="subtitle"></div>

      <div class="bar">
        <div class="title" id="sceneTitle">Install</div>
        <div class="progress"><span id="progressFill"></span></div>
        <div class="meta" id="sceneMeta">1 / 1</div>
      </div>
    </div>

    <script>
      const scenes = [
        {
          title: 'Install',
          file: 'terminal',
          durationMs: 4200,
          subtitle: 'Install tanstack-fetch. It is a tiny typed fetch client shaped for TanStack Query.',
          code: `<span class="tok-cm"># Node 18+ with native fetch</span>
npm install <span class="tok-str">tanstack-fetch</span> <span class="tok-str">@tanstack/react-query</span>`,
        },
        {
          title: 'Create the client',
          file: 'src/lib/api.ts',
          durationMs: 7000,
          subtitle: 'createFetch builds a shared HTTP client. Methods return data directly — perfect for queryFn.',
          code: `<span class="tok-kw">import</span> { <span class="tok-fn">createFetch</span> } <span class="tok-kw">from</span> <span class="tok-str">'tanstack-fetch'</span>

<span class="tok-kw">export const</span> <span class="tok-prop">api</span> = <span class="tok-fn">createFetch</span>({
  <span class="tok-prop">baseUrl</span>: <span class="tok-prop">import</span>.meta.env.VITE_API_URL,
  <span class="tok-prop">getToken</span>: () => localStorage.getItem(<span class="tok-str">'access_token'</span>),
})`,
        },
        {
          title: 'Status handlers',
          file: 'src/lib/api.ts',
          durationMs: 8000,
          subtitle: 'Handle 401 / 403 / 404 / 5xx before the error is thrown to TanStack Query.',
          code: `<span class="tok-kw">export const</span> <span class="tok-prop">api</span> = <span class="tok-fn">createFetch</span>({
  <span class="tok-prop">baseUrl</span>: <span class="tok-str">'https://api.example.com'</span>,
  <span class="tok-prop">getToken</span>: () => localStorage.getItem(<span class="tok-str">'access_token'</span>),

  <span class="tok-prop">onUnauthorized</span>: () => {
    localStorage.removeItem(<span class="tok-str">'access_token'</span>)
    window.location.href = <span class="tok-str">'/login'</span>
  },
  <span class="tok-prop">onForbidden</span>: () => console.warn(<span class="tok-str">'No permission'</span>),
  <span class="tok-prop">onNotFound</span>: ({ error }) => console.warn(error.message),
  <span class="tok-prop">onServerError</span>: ({ status }) => console.error(status),
})`,
        },
        {
          title: 'GET with TanStack Query',
          file: 'src/features/users/users.page.tsx',
          durationMs: 8500,
          subtitle: 'Pass signal for cancellation. api.get&lt;T&gt;() resolves to T, or throws FetchError.',
          code: `<span class="tok-kw">import</span> { <span class="tok-fn">useQuery</span> } <span class="tok-kw">from</span> <span class="tok-str">'@tanstack/react-query'</span>
<span class="tok-kw">import</span> { <span class="tok-prop">api</span> } <span class="tok-kw">from</span> <span class="tok-str">'#/lib/api'</span>
<span class="tok-kw">import</span> { <span class="tok-fn">isFetchError</span> } <span class="tok-kw">from</span> <span class="tok-str">'tanstack-fetch'</span>

<span class="tok-kw">const</span> <span class="tok-fn">UsersPage</span> = () => {
  <span class="tok-kw">const</span> { data, error, isPending } = <span class="tok-fn">useQuery</span>({
    <span class="tok-prop">queryKey</span>: [<span class="tok-str">'users'</span>],
    <span class="tok-prop">queryFn</span>: ({ signal }) =>
      <span class="tok-prop">api</span>.<span class="tok-fn">get</span>&lt;<span class="tok-type">User</span>[]&gt;(<span class="tok-str">'/users'</span>, { signal }),
  })

  <span class="tok-kw">if</span> (isPending) <span class="tok-kw">return</span> &lt;p&gt;Loading…&lt;/p&gt;
  <span class="tok-kw">if</span> (<span class="tok-fn">isFetchError</span>(error)) <span class="tok-kw">return</span> &lt;p&gt;{error.status}&lt;/p&gt;
  <span class="tok-kw">return</span> &lt;ul&gt;{data.map((u) => &lt;li key={u.id}&gt;{u.name}&lt;/li&gt;)}&lt;/ul&gt;
}`,
        },
        {
          title: 'POST / PATCH / DELETE',
          file: 'src/features/posts/posts.api.ts',
          durationMs: 7500,
          subtitle: 'Mutations use body in options. Same client, same error model.',
          code: `<span class="tok-kw">export const</span> <span class="tok-fn">createPost</span> = (<span class="tok-prop">input</span>: <span class="tok-type">CreatePostDto</span>) =>
  <span class="tok-prop">api</span>.<span class="tok-fn">post</span>&lt;<span class="tok-type">PostDto</span>&gt;(<span class="tok-str">'/posts'</span>, { <span class="tok-prop">body</span>: input })

<span class="tok-kw">export const</span> <span class="tok-fn">updatePost</span> = (<span class="tok-prop">id</span>: <span class="tok-type">number</span>, <span class="tok-prop">input</span>: <span class="tok-type">UpdatePostDto</span>) =>
  <span class="tok-prop">api</span>.<span class="tok-fn">patch</span>&lt;<span class="tok-type">PostDto</span>&gt;(<span class="tok-str">\`/posts/\${id}\`</span>, { <span class="tok-prop">body</span>: input })

<span class="tok-kw">export const</span> <span class="tok-fn">removePost</span> = (<span class="tok-prop">id</span>: <span class="tok-type">number</span>) =>
  <span class="tok-prop">api</span>.<span class="tok-fn">delete</span>(<span class="tok-str">\`/posts/\${id}\`</span>)`,
        },
        {
          title: 'Reusable app config',
          file: 'packages/apis/src/client/fetch-client.ts',
          durationMs: 8500,
          subtitle: 'Wrap createFetch once. Apps only pass baseURL, auth, mocks, and status handlers.',
          code: `<span class="tok-kw">import</span> { <span class="tok-fn">createFetch</span> } <span class="tok-kw">from</span> <span class="tok-str">'tanstack-fetch'</span>

<span class="tok-kw">export const</span> <span class="tok-fn">configureApis</span> = (<span class="tok-prop">options</span>: <span class="tok-type">ApiConfig</span>) => {
  <span class="tok-kw">return</span> <span class="tok-fn">createFetch</span>({
    <span class="tok-prop">baseUrl</span>: options.baseURL,
    <span class="tok-prop">getToken</span>: options.getToken,
    <span class="tok-prop">onUnauthorized</span>: options.onUnauthorized,
    <span class="tok-prop">fetch</span>: <span class="tok-fn">createMockFetch</span>(options.mocks),
  })
}`,
        },
        {
          title: 'Mock routes',
          file: 'apps/application-pwa/src/config/api.ts',
          durationMs: 8000,
          subtitle: 'Enable mocks for local/demo flows. Real network is used when mocks are off.',
          code: `<span class="tok-kw">export const</span> <span class="tok-prop">apiConfig</span> = {
  <span class="tok-prop">baseURL</span>: import.meta.env.VITE_APP_API_URL,
  <span class="tok-prop">mocks</span>: {
    <span class="tok-prop">enabled</span>: <span class="tok-kw">true</span>,
    <span class="tok-prop">routes</span>: [{
      <span class="tok-prop">method</span>: <span class="tok-str">'GET'</span>,
      <span class="tok-prop">path</span>: <span class="tok-str">'/v1/market/overview'</span>,
      <span class="tok-prop">handler</span>: getMarketOverviewMock,
    }],
  },
}`,
        },
        {
          title: 'Query the mock',
          file: 'modules/home/hooks/home.hook.ts',
          durationMs: 7500,
          subtitle: 'Same createFetch call path: controller → getApiClient().get → mock Response.json.',
          code: `<span class="tok-kw">const</span> { data: overview } = <span class="tok-fn">useQuery</span>(
  marketController.<span class="tok-fn">getOverview</span>(),
)

<span class="tok-cm">// under the hood</span>
<span class="tok-prop">queryFn</span>: () =>
  getApiClient().<span class="tok-fn">get</span>&lt;<span class="tok-type">MarketOverviewDto</span>&gt;(
    <span class="tok-str">'/v1/market/overview'</span>,
  )`,
        },
        {
          title: 'Done',
          file: 'summary',
          durationMs: 5000,
          subtitle: 'tanstack-fetch: typed fetch for TanStack Query — createFetch, status handlers, mocks, zero Axios.',
          code: `<span class="tok-cm">// Mental model</span>
createFetch(config)
  .<span class="tok-fn">get</span> / .<span class="tok-fn">post</span> / .<span class="tok-fn">patch</span> / .<span class="tok-fn">delete</span>
  → <span class="tok-type">Promise</span>&lt;T&gt;
  → throws <span class="tok-type">FetchError</span> on HTTP failure
  → pass { signal } from queryFn

npm i <span class="tok-str">tanstack-fetch</span>`,
        },
      ]

      let index = 0
      let playing = false
      let timer = null
      let startedAt = 0
      let raf = null

      const codeEl = document.getElementById('code')
      const subtitleEl = document.getElementById('subtitle')
      const fileNameEl = document.getElementById('fileName')
      const sceneTitleEl = document.getElementById('sceneTitle')
      const sceneMetaEl = document.getElementById('sceneMeta')
      const progressFillEl = document.getElementById('progressFill')
      const playBtn = document.getElementById('playBtn')

      const render = () => {
        const scene = scenes[index]
        codeEl.innerHTML = scene.code
        subtitleEl.textContent = scene.subtitle
        fileNameEl.textContent = scene.file
        sceneTitleEl.textContent = scene.title
        sceneMetaEl.textContent = `${index + 1} / ${scenes.length}`
        progressFillEl.style.width = '0%'
      }

      const stopProgress = () => {
        if (raf) cancelAnimationFrame(raf)
        raf = null
      }

      const tickProgress = () => {
        const scene = scenes[index]
        const elapsed = Date.now() - startedAt
        const pct = Math.min(100, (elapsed / scene.durationMs) * 100)
        progressFillEl.style.width = `${pct}%`
        if (pct < 100 && playing) {
          raf = requestAnimationFrame(tickProgress)
        }
      }

      const clearTimer = () => {
        if (timer) clearTimeout(timer)
        timer = null
        stopProgress()
      }

      const go = (next) => {
        clearTimer()
        index = (next + scenes.length) % scenes.length
        render()
        if (playing) schedule()
      }

      const schedule = () => {
        clearTimer()
        startedAt = Date.now()
        tickProgress()
        timer = setTimeout(() => {
          if (index >= scenes.length - 1) {
            playing = false
            playBtn.textContent = 'Replay'
            progressFillEl.style.width = '100%'
            return
          }
          go(index + 1)
        }, scenes[index].durationMs)
      }

      const togglePlay = () => {
        playing = !playing
        playBtn.textContent = playing ? 'Pause' : 'Play'
        if (playing) schedule()
        else clearTimer()
      }

      document.getElementById('playBtn').addEventListener('click', togglePlay)
      document.getElementById('prevBtn').addEventListener('click', () => {
        playing = false
        playBtn.textContent = 'Play'
        go(index - 1)
      })
      document.getElementById('nextBtn').addEventListener('click', () => {
        playing = false
        playBtn.textContent = 'Play'
        go(index + 1)
      })
      document.getElementById('fsBtn').addEventListener('click', async () => {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen()
        } else {
          await document.exitFullscreen()
        }
      })

      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          event.preventDefault()
          togglePlay()
        }
        if (event.code === 'ArrowRight') go(index + 1)
        if (event.code === 'ArrowLeft') go(index - 1)
      })

      render()
      togglePlay()
    </script>
  </body>
</html>
